# Jaeger v2.21.0: OpenTelemetry traces for the department, kept on disk (Badger) for 7 days.
# Based on Jaeger's own all-in-one.yaml and config-badger.yaml for v2.21.0, with the in-memory
# store swapped for Badger and the MCP endpoint (/api/ai/mcp/) kept on.
# Apps send OTLP to port 4317 (gRPC) or 4318 (HTTP). The UI, the query API and MCP are on 16686.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:13133"

  jaeger_query:
    storage:
      traces: traces_store
    ai:
      # Read-only MCP tools for agents, served at /api/ai/mcp/ on the query port.
      mcp: {}

  jaeger_storage:
    backends:
      traces_store:
        badger:
          directories:
            keys: "${env:JAEGER_BADGER_DIR:-/badger}/keys"
            values: "${env:JAEGER_BADGER_DIR:-/badger}/values"
          ephemeral: false
          ttl:
            spans: 168h # 7 days

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4317"
      http:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4318"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: traces_store
